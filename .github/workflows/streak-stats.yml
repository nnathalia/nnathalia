name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # todo dia as 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # sempre que este arquivo mudar
  workflow_dispatch: # execucao manual pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&theme=tokyonight-duo&hide_border=true&background=0A1020&ring=FF6B9D&fire=FF6B9D&currStreakLabel=4A9FD8&border_radius=18"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "atualiza streak de contribuicoes" || exit 0
          git pull --rebase
          git push
